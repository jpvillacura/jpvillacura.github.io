short_bio: >-
  What gives my life meaning is doing the correct thing, even if it is harder or it is altruistic. Since I was a Child I liked computers and dreamed about being a Hacker and I studied mechanical engineering to create robots. <br>
  
  I am a Lecturer in Programming courses for First-Year Engineering students at universidad Técnica Federico Santa María. I was Visiting Researcher Student at Queen's University in Canada in Queen's Reliable Software Technology Group under supervision of Prof. Mohammad Zulkernine.   <br>

  I have won the Emerging Leaders in the Americas Program 2025-26 by Global Affairs Canada, a competitive scholarship where each year only 100 applicants are selected from more than 40 countries in Latin America and The Caribbean. From this experience I learned the importance of multiculturality, the importance of respect our beliefs and I decided to take a PhD soon.  <br>

  I was mentor in Technovation Girls Chile, where we supported the next generations of woman Leaders and their inclusion in STEM developing a mobile Application using MitAppInventor that approaches the responsible consumption in the world.  <br>

  My extracurricular activities are involved with the music. I study formal piano in Conservatorio Izidor Handler, Viña del Mar. And I play the electric guitar. I am interested in self-growth. 

